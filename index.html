<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Wolves Roster</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🐺 Dark Wolves</h1>
        <p>Tarren Mill EU</p>
    </header>

    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search characters..."
        >

    </div>

    <div id="memberCount" class="member-count">
        Loading roster...
    </div>

    <div class="table-wrapper">

        <table id="rosterTable">

            <thead>
<tr>
    <th data-sort="name">Character</th>
    <th data-sort="rank">Rank</th>
    <th data-sort="level">Level</th>
    <th data-sort="ilevel">iLvl</th>
    <th data-sort="mplus">M+</th>
    <th data-sort="pvp">PvP</th>
    <th data-sort="honor">Honor</th>
    <th data-sort="raid">Raid</th>
    <th data-sort="achievements">Achievements</th>
</tr>
</thead>

            <tbody id="rosterBody"></tbody>

        </table>

    </div>

</div>

<button id="backToTop" title="Back to top">
    ↑
</button>
    
<script src="script.js"></script>

</body>
</html>
